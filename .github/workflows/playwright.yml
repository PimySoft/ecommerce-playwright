name: Playwright Tests

# Pull requests get fast @smoke feedback on Chrome. main and the nightly run get the full suite on every browser.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: Browser project to run
        type: choice
        options: [ all, chrome, firefox, safari, mobile-chrome, visual ]
        default: all
      tag:
        description: Test tier to run
        type: choice
        options: [ all, '@smoke', '@regression' ]
        default: all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Check the visual job's image matches the Playwright version
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          grep -q "mcr.microsoft.com/playwright:v${version}-noble" .github/workflows/playwright.yml \
            || { echo "::error::Set the visual job's image to v${version}-noble and regenerate the baselines"; exit 1; }

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      grep: ${{ steps.plan.outputs.grep }}
      run-matrix: ${{ steps.plan.outputs.run-matrix }}
      run-visual: ${{ steps.plan.outputs.run-visual }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_BROWSER: ${{ inputs.browser }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$EVENT" in
            pull_request)      browser=chrome;          tag=@smoke ;;
            workflow_dispatch) browser="$INPUT_BROWSER"; tag="$INPUT_TAG" ;;
            *)                 browser=all;             tag=all ;;
          esac
          case "$browser" in
            all)    projects="chrome firefox safari mobile-chrome" ;;
            visual) projects="" ;;
            *)      projects="$browser" ;;
          esac
          # Visual tests are all @regression and run in their own container job.
          [ "$tag" != @smoke ] && { [ "$browser" = all ] || [ "$browser" = visual ]; } && run_visual=true || run_visual=false
          [ "$tag" = all ] && grep="" || grep="$tag"

          entries=""
          for project in $projects; do
            # Smoke is a handful of tests, so splitting it only adds job start-up time.
            [ "$tag" = @smoke ] && shards=1 || shards=2
            case "$project" in
              chrome)  install="" ;;
              firefox) install=firefox ;;
              safari)  install=webkit ;;
              # The project only runs @smoke: one shard is enough, and a @regression run would find no tests and fail.
              mobile-chrome)
                install=chromium
                shards=1
                [ "$tag" = @regression ] && continue ;;
            esac
            for shard in $(seq 1 "$shards"); do
              entries="$entries$(jq -nc --arg project "$project" --arg install "$install" --argjson shard "$shard" --argjson shards "$shards" \
                '{project: $project, install: $install, shard: $shard, shards: $shards}')"
            done
          done
          [ -n "$entries" ] && run_matrix=true || run_matrix=false

          echo "matrix=$(echo "$entries" | jq -sc '{include: .}')" >> "$GITHUB_OUTPUT"
          echo "run-matrix=$run_matrix" >> "$GITHUB_OUTPUT"
          echo "run-visual=$run_visual" >> "$GITHUB_OUTPUT"
          echo "grep=$grep" >> "$GITHUB_OUTPUT"
          echo "Projects: ${projects:-none} | visual: $run_visual | tag: $tag" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: test (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: [ static-checks, plan ]
    if: needs.plan.outputs.run-matrix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # The target is a shared public site; capping concurrent jobs keeps it from answering "queue full".
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The `chrome` project uses the Google Chrome channel, which the ubuntu-latest image already ships.
      - name: Cache Playwright browsers
        if: matrix.install != ''
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ matrix.install }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser
        if: matrix.install != '' && steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.install }}
      - name: Install browser system dependencies
        if: matrix.install != '' && steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.install }}

      - name: Run Playwright tests
        env:
          GREP: ${{ needs.plan.outputs.grep }}
        run: >
          npx playwright test
          --project=${{ matrix.project }}
          --shard=${{ matrix.shard }}/${{ matrix.shards }}
          ${GREP:+--grep "$GREP"}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.project }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1
      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # The baselines are rendered in this image (npm run test:visual), so the comparison is pixel-exact.
  # The static-checks job fails if the tag drifts from the pinned @playwright/test version.
  visual:
    needs: [ static-checks, plan ]
    if: needs.plan.outputs.run-visual == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_DOCKER: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test --project=visual
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-visual
          path: blob-report/
          retention-days: 1
      # Holds the expected, actual and diff images of any failed comparison.
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-visual
          path: test-results/
          retention-days: 7

  merge-reports:
    needs: [ test, visual ]
    if: ${{ !cancelled() && (needs.test.result != 'skipped' || needs.visual.result != 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      # The visual job runs in a container, so its blobs record a different test directory. Passing the config
      # tells merge-reports where the tests live instead of refusing to merge.
      - run: npx playwright merge-reports --config playwright.config.ts --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Prepare report for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

  publish-report:
    needs: merge-reports
    if: ${{ !cancelled() && needs.merge-reports.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  report-nightly-failure:
    needs: [ static-checks, test, visual ]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the nightly-failure issue
        run: |
          gh label create nightly-failure --color B60205 --description "The scheduled full-suite run failed" --force
          body="The nightly run on \`main\` failed: $RUN_URL"
          issue=$(gh issue list --label nightly-failure --state open --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "Nightly test run failed" --label nightly-failure --body "$body"
          fi
